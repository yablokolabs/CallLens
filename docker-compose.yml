services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calllens
      POSTGRES_PASSWORD: calllens
      POSTGRES_DB: calllens
    ports:
      - "5432:5432"
    volumes:
      - calllens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calllens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://calllens:calllens@db:5432/calllens
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CALLS_ANALYZE_SYNC: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn calllens.api:create_app --factory --host 0.0.0.0 --port 8000

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  calllens_pg:
