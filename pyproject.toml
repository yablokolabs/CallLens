[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calllens"
version = "0.1.0"
description = "Open-source conversation intelligence and behavioral evaluation powered by LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yabloko Labs", email = "ceo@yablokolabs.com" }]
keywords = [
    "conversation-intelligence",
    "langgraph",
    "speech-to-text",
    "diarization",
    "rubric-scoring",
    "call-analysis",
    "llm",
    "elevenlabs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "elevenlabs>=2.40",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mcp = ["fastmcp>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "asyncpg>=0.29",
]

[project.scripts]
calllens = "calllens.cli:app"

[tool.setuptools.packages.find]
where = ["packages/calllens/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/calllens/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["apps/web", ".venv", "mcp-server"]
